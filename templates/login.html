<!-- login.html -->
{% extends "base.html" %}

{% block title %}Admin Login - Photo Gallery{% endblock %}

{% block nav_title %}Admin <span class="text-emerald-400">Login</span>{% endblock %}

{% block nav_items %}
<a href="/" class="inline-flex items-center gap-2 rounded-md px-3 py-2 text-sm font-semibold text-gray-200/80 hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#34D399]">
  <i class="fas fa-arrow-left"></i>
  <span>Back</span>
</a>
{% endblock %}

{% block content %}
<div class="px-4 sm:px-0 pt-6 pb-10">
  <div class="mx-auto max-w-md">
    <div class="rounded-lg border border-white/10 bg-white/5 shadow-lg shadow-black/30 backdrop-blur-xs">
      <div class="border-b border-white/10 p-4 sm:p-5">
        <div class="flex items-start gap-3">
          <div class="mt-0.5 inline-flex h-9 w-9 items-center justify-center rounded-full border border-white/10 bg-black/30 text-white/90">
            <i class="fas fa-lock"></i>
          </div>
          <div class="min-w-0">
            <h2 class="font-merienda text-2xl font-bold tracking-wide text-white">Sign in</h2>
            <p class="mt-1 text-sm text-gray-200/70">Access the admin panel to manage albums.</p>
          </div>
        </div>
      </div>

      <div class="p-4 sm:p-5">
        {% if error %}
        <div class="mb-4 rounded-md border border-red-500/30 bg-red-500/15 px-4 py-3 text-sm text-red-100" role="alert">
          <div class="flex items-start gap-2">
            <i class="fas fa-triangle-exclamation mt-0.5 text-red-200/90"></i>
            <span class="block">{{ error }}</span>
          </div>
        </div>
        {% endif %}

        <form action="/login" method="POST" onsubmit="toggleLoadingState(this)" class="space-y-5">
          <div>
            <label for="username" class="block text-sm font-semibold text-gray-200/80">Username</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              spellcheck="false"
              autocorrect="off"
              autocapitalize="none"
              required
              class="mt-1 block w-full rounded-md border border-white/10 bg-zinc-900 px-3 py-2 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-[#34D399]"
              placeholder="Username"
            />
          </div>

          <div>
            <label for="password" class="block text-sm font-semibold text-gray-200/80">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              spellcheck="false"
              autocorrect="off"
              autocapitalize="none"
              required
              class="mt-1 block w-full rounded-md border border-white/10 bg-zinc-900 px-3 py-2 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-[#34D399]"
              placeholder="Password"
            />
          </div>

          <button
            id="login-button"
            type="submit"
            class="mt-2 inline-flex w-full items-center justify-center gap-2 rounded-md border border-white/10 bg-emerald-500/20 px-4 py-2 text-sm font-semibold text-emerald-100 hover:bg-emerald-500/30 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#34D399] disabled:cursor-not-allowed disabled:opacity-60"
          >
            <span id="button-text">Sign in</span>
            <span
              id="spinner"
              class="hidden h-5 w-5 animate-spin rounded-full border-2 border-emerald-300/90 border-t-transparent"
            ></span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  function toggleLoadingState(form) {
    const button = document.getElementById("login-button");
    const buttonText = document.getElementById("button-text");
    const spinner = document.getElementById("spinner");

    button.setAttribute("disabled", "true");
    buttonText.classList.add("hidden");
    spinner.classList.remove("hidden");
  }
</script>
{% endblock %}
